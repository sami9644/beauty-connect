<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty connect - Barber Auth</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #f59e0b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #111827;
            --input-border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        /* Clean Mobile-First UI Canvas */
        .app-container {
            width: 100%;
            max-width: 480px; /* Retains the app layout on desktop without the container look */
            min-height: 100vh;
            background-color: #111827;
            display: flex;
            flex-direction: column;
            position: relative; /* Ensures absolute flash messages align perfectly inside */
        }

        /* Header Layout */
        .header {
            padding: 30px 20px 15px;
            text-align: center;
            border-bottom: 1px solid #1f2937;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .header h1 span {
            color: var(--accent-color);
        }

        /* Toggle Tab Navigation */
        .auth-tabs {
            display: flex;
            background-color: var(--card-bg);
            margin: 20px 20px 10px;
            border-radius: 12px;
            padding: 4px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: #000;
        }

        /* Form Container */
        .content {
            flex: 1;
            padding: 0 20px 30px;
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 18px;
            margin-top: 10px;
        }

        .auth-form.active {
            display: flex;
        }

        /* Custom Input Groups */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .form-group input, .form-group select {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            padding: 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--accent-color);
        }

        /* Form Main Action Button */
        .submit-btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.1s ease;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .switch-prompt {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .switch-prompt span {
            color: var(--accent-color);
            cursor: pointer;
            font-weight: 600;
        }

        .flash-messages {
            width: 100%;
            padding: 15px;
            background-color: #1e293b;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.3);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            border-bottom: 2px solid var(--accent-color);
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            font-weight: bold;
            z-index: 10;
        }

        #close-btn {
            background-color: transparent;
            border: none;
            color: #FFF;
            font-weight: bolder;
            align-self: flex-end;
            padding: 5px;
            cursor: pointer;
        }

        .error {
            color: #ef4444;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Retrieve and iterate over the flashed messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flash-messages">
                <button id="close-btn" onclick='document.querySelector(".flash-messages").style.display="none"'>X</button>
              {% for category, message in messages %}
                <div class="flash {{ category }}">
                  {{ message }}
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <!-- Brand Header -->
        <div class="header">
            <h1>Beauty connect<span>.</span> Barber</h1>
        </div>

        <!-- Auth Mode Toggle Links -->
        <div class="auth-tabs">
            <button class="tab-btn active" onclick="switchTab('signin')">Sign In</button>
            <button class="tab-btn" onclick="switchTab('register')">Register</button>
        </div>

        <!-- Scrollable Form Content -->
        <div class="content">
            
            <!-- SIGN IN VIEW -->
            <form id="signin-form" method="post" class="auth-form active" action="/barber/signin">
                <div class="form-group">
                    <label for="login-phone">Phone Number</label>
                    <input type="tel" id="login-phone" name="tel-no" placeholder="e.g. +251..." required>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="submit-btn">Sign In</button>
                <p class="switch-prompt">Don't have an account? <span onclick="switchTab('register')">Register here</span></p>
            </form>

            <!-- REGISTER VIEW -->
            <form id="register-form" method="post" class="auth-form" action="/barber/signup">
                <div class="form-group">
                    <label for="reg-shop-name">Barber Shop Name</label>
                    <input type="text" id="reg-shop-name" name="shop-name" placeholder="Classic Cuts Studio" required>
                </div>

                <div class="form-group">
                    <label for="reg-phone">Phone Number</label>
                    <input type="number" id="reg-phone" name="tel-no" placeholder="e.g. 09... or 07..." required>
                </div>

                <div class="form-group">
                    <label for="reg-address">Shop Address / Location</label>
                    <input type="text" id="reg-address" name="shop-add" placeholder="Bole, Camat Road, Next to..." required>
                </div>

                <div class="form-group">
                    <label for="reg-type">Service Type</label>
                    <select id="reg-type" name="type" required>
                        <option value="" disabled selected hidden>Select target client base</option>
                        <option value="men">For Men Only</option>
                        <option value="females">For Females Only</option>
                        <option value="both">Both (Unisex Salon)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="reg-password">Create Password</label>
                    <input type="password" name="password" id="reg-password" placeholder="Minimum 8 characters" minlength="8" required>
                </div>

                <button type="submit" class="submit-btn">Create Account</button>
                <p class="switch-prompt">Already registered? <span onclick="switchTab('signin')">Sign in instead</span></p>
            </form>

        </div>
    </div>

    <script>
        function switchTab(mode) {
            const tabs = document.querySelectorAll('.tab-btn');
            const forms = document.querySelectorAll('.auth-form');

            tabs.forEach(tab => tab.classList.remove('active'));
            forms.forEach(form => form.classList.remove('active'));

            if (mode === 'signin') {
                tabs[0].classList.add('active');
                document.getElementById('signin-form').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('register-form').classList.add('active');
            }
        }
    </script>
</body>
</html>
